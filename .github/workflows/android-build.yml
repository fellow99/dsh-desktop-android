# 001-building-workflow · GitHub Actions 自动构建与发布
#
# 触发：push tag v*（首发 v0.2.1）→ 构建 full/debug APK（彩排版）并发布 GitHub Release。
# 手动：workflow_dispatch（无 tag 时回落工程默认版本 0.1.0/1，仅用于彩排）。
#
# 三件套在云端现做（二进制不入库，docs/000-工程规划.md §13）：
#   ① 引擎：aosp-node-runtime Release 归档（sha256 对账）→ 八项 ELF 门禁 → 投放 jniLibs
#   ② 载荷：deepseek-harness @ dsh-v0.2.1-rc.2（pnpm）+ dsh-market @ v1.66.42（npm）
#      → assemble-payload --deploy --apply → package-payload
#   ③ APK：:app:assembleFullDebug（JDK 17，版本从 tag 注入）
#
# 上游 ref 锁定见 specs/001-building-workflow/spec.md §4。
# 评审修复（logs/20261029-2/REVIEW_REPORT.md）：
#   - 引擎 lock 源锁 origin/main@605715e7（tag v24.22.1 的 lock 仍是 active=24.2.0），
#     并断言 lock.active.node == 24.22.1（与 node-bridge 0.2.0 的引擎配对）；
#   - 归档下载 URL 由 lock 的 release.tag + release.archive 构造（lock 的 url 字段是发布页，非下载直链）；
#   - 上游仓 checkout 进工作区子目录 upstream/*，经 DSH_HARNESS_DIR/DSH_MARKET_DIR 注入
#     （actions/checkout 拒绝 ../ 父相对路径）。

name: android-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK (full/debug) & Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # 上游锁定（spec.md §4）
      NODE_RUNTIME_REPO: fellow99/aosp-node-runtime
      # runtime.lock.json 必须来自 active=24.22.1 的提交（tag v24.22.1 的 lock 尚为 24.2.0）
      NODE_RUNTIME_REF: 605715e7d5e1d02c8ac055c87be3232f0970c67d
      DSH_HARNESS_REF: dsh-v0.2.1-rc.2
      DSH_MARKET_REF: v1.66.42
      PNPM_VERSION: '11.28.5'        # 对齐 deepseek-harness packageManager
      EXPECTED_ENGINE_NODE: '24.22.1' # 引擎配对：node-bridge 0.2.0 ↔ node 24.22.1
    steps:
      - name: ① Meta — 从 tag 派生版本
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH%%-*}
            VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=''; VCODE=''
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"

      - name: ① Checkout dsh-desktop-android
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ② Checkout aosp-node-runtime @ ${{ env.NODE_RUNTIME_REF }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NODE_RUNTIME_REPO }}
          ref: ${{ env.NODE_RUNTIME_REF }}
          path: node-runtime-checkout
          persist-credentials: false

      - name: ② Setup Node 22 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ② Install pnpm @ ${{ env.PNPM_VERSION }}
        run: |
          npm install -g "pnpm@${PNPM_VERSION}"
          pnpm config set store-dir "$HOME/.pnpm-store" --global
          pnpm --version

      - name: ③ 引擎归档下载 + archiveSha256 对账（单一事实源：runtime.lock.json）
        env:
          EXPECTED_ENGINE_NODE: ${{ env.EXPECTED_ENGINE_NODE }}
        run: |
          export LOCK="$GITHUB_WORKSPACE/node-runtime-checkout/runtime.lock.json"
          ACTIVE_NODE=$(node -e "const l=require(process.env.LOCK);console.log(l.active.node)")
          if [[ "$ACTIVE_NODE" != "$EXPECTED_ENGINE_NODE" ]]; then
            echo "::error::引擎配对漂移：lock.active.node=$ACTIVE_NODE，期望 $EXPECTED_ENGINE_NODE（node-bridge 0.2.0 配对）；请更新 NODE_RUNTIME_REF 或 EXPECTED_ENGINE_NODE"
            exit 1
          fi
          read -r REL_TAG ARCHIVE WANT_SHA <<< "$(node -e "const l=require(process.env.LOCK);const r=l.releases.find(r=>r.node===l.active.node&&r.abi===l.active.abi);console.log(r.release.tag, r.release.archive, r.release.archiveSha256)")"
          # lock 的 release.url 是发布页地址，下载直链按 release.tag + release.archive 构造
          ARCHIVE_URL="https://github.com/${NODE_RUNTIME_REPO}/releases/download/${REL_TAG}/${ARCHIVE}"
          echo "归档：$ARCHIVE_URL"
          mkdir -p build/engine
          curl -fL --retry 3 --silent --show-error -o "build/engine/$ARCHIVE" "$ARCHIVE_URL"
          echo "$WANT_SHA  $ARCHIVE" | (cd build/engine && sha256sum -c -)
          tar -xzf "build/engine/$ARCHIVE" -C build/engine
          LIBNODE=$(find build/engine -name 'libnode.so' -type f | head -n1)
          if [[ -z "$LIBNODE" ]]; then echo "::error::归档内未找到 libnode.so"; exit 1; fi
          echo "ENGINE_LIBNODE=$LIBNODE" >> "$GITHUB_ENV"

      - name: ④ 八项 ELF 门禁 + 投放（tools/provision.mjs）
        env:
          EXPECTED_ENGINE_NODE: ${{ env.EXPECTED_ENGINE_NODE }}
        run: |
          node node-runtime-checkout/tools/provision.mjs \
            --node "$EXPECTED_ENGINE_NODE" \
            --out node-runtime/src/main/jniLibs \
            --from "$ENGINE_LIBNODE"

      - name: ⑤ 投放 jniLibs（provision-engine.mjs）
        run: |
          DSH_ANDROID_RUNTIME_DIR="$GITHUB_WORKSPACE/node-runtime-checkout" \
            node scripts/provision-engine.mjs

      - name: ⑥ Checkout deepseek-harness @ ${{ env.DSH_HARNESS_REF }}
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: upstream/deepseek-harness
          persist-credentials: false

      - name: ⑥ pnpm store 缓存键（来自 harness lockfile 哈希）
        run: |
          HASH=$(sha256sum upstream/deepseek-harness/pnpm-lock.yaml | cut -d' ' -f1)
          echo "PNPM_LOCK_HASH=$HASH" >> "$GITHUB_ENV"

      - name: ⑥ Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ env.PNPM_LOCK_HASH }}
          restore-keys: pnpm-store-

      - name: ⑥ 构建上游 harness（pnpm install --frozen-lockfile + build）
        run: |
          cd "$GITHUB_WORKSPACE/upstream/deepseek-harness"
          pnpm install --frozen-lockfile
          pnpm build

      - name: ⑦ Checkout dsh-market @ ${{ env.DSH_MARKET_REF }}
        uses: actions/checkout@v4
        with:
          repository: dsh-market/dsh-market
          ref: ${{ env.DSH_MARKET_REF }}
          path: upstream/dsh-market
          persist-credentials: false

      - name: ⑦ 构建 dsh-market（npm ci + build）
        run: |
          cd "$GITHUB_WORKSPACE/upstream/dsh-market"
          npm ci --no-audit --no-fund
          npm run build

      - name: ⑧⑨ 装配 + 打包载荷（版本注入；上游根经环境变量指向 upstream/*）
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          DSH_HARNESS_DIR: ${{ github.workspace }}/upstream/deepseek-harness
          DSH_MARKET_DIR: ${{ github.workspace }}/upstream/dsh-market
        run: |
          node scripts/assemble-payload.mjs --deploy --apply
          DSH_APP_VERSION="$APP_VERSION" \
            node scripts/package-payload.mjs --src build/payload-stage/root

      - name: ⑩ Setup JDK 17（Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: ⑩ 补装 Android SDK 组件（build-tools 36.0.0 / platform 36）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: ⑪ Gradle assembleFullDebug（tag 时注入版本）
        env:
          IS_TAG: ${{ steps.meta.outputs.is_tag }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_VCODE: ${{ steps.meta.outputs.vcode }}
        run: |
          ARGS=()
          if [[ "$IS_TAG" == "true" ]]; then
            ARGS+=("-PappVersionName=$APP_VERSION" "-PappVersionCode=$APP_VCODE")
          fi
          ./gradlew :app:assembleFullDebug "${ARGS[@]}"

      - name: ⑫ aapt 断言版本元数据（aapt 输出 versionCode 在前）
        env:
          IS_TAG: ${{ steps.meta.outputs.is_tag }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_VCODE: ${{ steps.meta.outputs.vcode }}
        run: |
          APK=app/build/outputs/apk/full/debug/app-full-debug.apk
          test -f "$APK" || { echo "::error::APK 未产出"; exit 1; }
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep '^package:'
          if [[ "$IS_TAG" == "true" ]]; then
            echo "$BADGING" | grep -F "versionCode='$APP_VCODE' versionName='$APP_VERSION'" \
              || { echo "::error::版本注入未生效（期望 versionCode=$APP_VCODE versionName=$APP_VERSION）"; exit 1; }
          fi

      - name: ⑬ 收集产物 + 指纹 summary
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          NODE_RUNTIME_REF: ${{ env.NODE_RUNTIME_REF }}
          DSH_HARNESS_REF: ${{ env.DSH_HARNESS_REF }}
          DSH_MARKET_REF: ${{ env.DSH_MARKET_REF }}
        run: |
          APK=app/build/outputs/apk/full/debug/app-full-debug.apk
          REL_VERSION="${APP_VERSION:-0.1.0}"
          NAME="dsh-${REL_VERSION}-debug.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          cp app/src/main/assets/dsh-payload/dsh.version dist/dsh.version
          APK_SHA=$(sha256sum "dist/$NAME" | cut -d' ' -f1)
          TAR_SHA=$(head -n1 dist/dsh.version | cut -d= -f2)
          ENGINE_SHA=$(node -e "const l=require('./node-runtime-checkout/runtime.lock.json');const r=l.releases.find(r=>r.node===l.active.node&&r.abi===l.active.abi);console.log(r.release.archiveSha256)")
          {
            echo "## dsh-desktop-android 构建指纹"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | $REL_VERSION（versionCode 见 badging） |"
            echo "| APK | \`$NAME\`（sha256 \`$APK_SHA\`） |"
            echo "| 引擎归档 | sha256 \`$ENGINE_SHA\`（runtime lock @ ${NODE_RUNTIME_REF:0:12}） |"
            echo "| 载荷 | dsh.tar sha256 \`$TAR_SHA\` |"
            echo "| 上游 | harness \`$DSH_HARNESS_REF\` / market \`$DSH_MARKET_REF\` / runtime \`$NODE_RUNTIME_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat dist/dsh.version
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: ⑭ 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk-${{ steps.meta.outputs.version || 'default' }}
          path: dist/
          if-no-files-found: error

      - name: ⑮ 发布 GitHub Release（仅 tag）
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ steps.meta.outputs.is_tag }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          DSH_HARNESS_REF: ${{ env.DSH_HARNESS_REF }}
          DSH_MARKET_REF: ${{ env.DSH_MARKET_REF }}
          NODE_RUNTIME_REF: ${{ env.NODE_RUNTIME_REF }}
        run: |
          if [[ "$IS_TAG" != "true" ]]; then
            echo "非 tag 触发（彩排），跳过 Release。"
            exit 0
          fi
          APK_SHA=$(sha256sum "dist/$APK_NAME" | cut -d' ' -f1)
          TAR_SHA=$(head -n1 dist/dsh.version | cut -d= -f2)
          cat > notes.md <<EOF
          dsh-desktop-android $APP_VERSION · full flavor / debug 签名（彩排版）/ arm64-v8a / Android 10+

          ## 构建指纹

          | 项 | 值 |
          |---|---|
          | APK | \`$APK_NAME\`（sha256 \`$APK_SHA\`） |
          | 载荷 | dsh.tar sha256 \`$TAR_SHA\`（dsh 0.2.1-rc.2 / node 24.22.1） |
          | 上游 | harness \`$DSH_HARNESS_REF\` / market \`$DSH_MARKET_REF\` / runtime lock \`$NODE_RUNTIME_REF\` |

          侧载：下载 APK 直接安装。
          EOF
          # 重跑幂等：先删旧 Release（默认保留 git tag，勿加 --cleanup-tag），再重建
          gh release delete "$GITHUB_REF_NAME" -y || true
          gh release create "$GITHUB_REF_NAME" "dist/$APK_NAME" \
            --title "dsh-desktop-android $APP_VERSION" \
            --notes-file notes.md
